name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: cmake -S . -B build-cmake -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-cmake --parallel
      - run: ctest --test-dir build-cmake --output-on-failure
      - run: bash tests/test_cmake_version_reconfigure.sh build-cmake
      - run: make test
      - name: Verify the synthetic supervision demo
        run: python3 scripts/demo_supervision.py build/agentshield
      - run: AGENTSHIELD_SOAK_SECONDS=5 make soak
      - run: make sanitize
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - run: make java-test
      - run: make portfolio-check
      - run: make deterministic-package
      - run: umask 077 && make verify-dist
      - run: make verify-deb
      - run: python3 -m json.tool build/agentshield-source.cdx.json > /dev/null
      - run: python3 -m json.tool build/agentshield-provenance.json > /dev/null
  codeql:
    name: CodeQL security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: c-cpp,java-kotlin
          build-mode: manual
      - run: make clean all java
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
