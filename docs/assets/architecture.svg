<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">AgentShield architecture</title>
  <desc id="desc">A Linux sensor sends normalized evidence to the risk and policy engine, which feeds the desktop console, audit chain, and future Helix Sentinel adapter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2036"/><stop offset="1" stop-color="#102d4b"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1bcfb9"/><stop offset="1" stop-color="#2668ec"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".22"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6fe4d3"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="54" y="58" fill="#fff" font-family="Segoe UI,Arial" font-size="25" font-weight="700">Evidence-driven runtime security</text>
  <text x="54" y="85" fill="#9ab2ca" font-family="Segoe UI,Arial" font-size="14">Deterministic enforcement stays separate from advisory analytics</text>
  <g filter="url(#shadow)">
    <rect x="55" y="135" width="235" height="170" rx="20" fill="#173a5d" stroke="#2b5276"/>
    <rect x="348" y="135" width="300" height="170" rx="20" fill="#173a5d" stroke="#2b5276"/>
    <rect x="706" y="105" width="220" height="105" rx="20" fill="#173a5d" stroke="#2b5276"/>
    <rect x="706" y="230" width="220" height="105" rx="20" fill="#173a5d" stroke="#2b5276"/>
    <rect x="984" y="135" width="165" height="170" rx="20" fill="#173a5d" stroke="#2b5276"/>
  </g>
  <g font-family="Segoe UI,Arial">
    <text x="82" y="174" fill="#6fe4d3" font-size="12" font-weight="700">C11 · READ-ONLY</text><text x="82" y="207" fill="#fff" font-size="21" font-weight="700">Linux sensor</text><text x="82" y="236" fill="#b8c9d9" font-size="14">/proc evidence</text><text x="82" y="260" fill="#b8c9d9" font-size="14">credentials · files · sockets</text><text x="82" y="284" fill="#b8c9d9" font-size="14">UID · capabilities · coverage</text>
    <text x="377" y="174" fill="#6fe4d3" font-size="12" font-weight="700">C++17 · SOURCE OF TRUTH</text><text x="377" y="207" fill="#fff" font-size="21" font-weight="700">Risk &amp; policy engine</text><text x="377" y="236" fill="#b8c9d9" font-size="14">Explainable findings · access drift</text><text x="377" y="260" fill="#b8c9d9" font-size="14">Allow · approval · deny</text><text x="377" y="284" fill="#b8c9d9" font-size="14">Advisory anomaly baseline</text>
    <text x="734" y="141" fill="#6fe4d3" font-size="12" font-weight="700">JAVA 17</text><text x="734" y="171" fill="#fff" font-size="18" font-weight="700">Desktop console</text><text x="734" y="194" fill="#b8c9d9" font-size="13">Live exposure &amp; Demo Lab</text>
    <text x="734" y="266" fill="#6fe4d3" font-size="12" font-weight="700">HMAC-SHA-256</text><text x="734" y="296" fill="#fff" font-size="18" font-weight="700">Audit &amp; export</text><text x="734" y="319" fill="#b8c9d9" font-size="13">Tamper-evident local chain</text>
    <text x="1010" y="174" fill="#6fe4d3" font-size="12" font-weight="700">FUTURE</text><text x="1010" y="207" fill="#fff" font-size="19" font-weight="700">Helix</text><text x="1010" y="231" fill="#fff" font-size="19" font-weight="700">Sentinel</text><text x="1010" y="262" fill="#b8c9d9" font-size="13">Verified adapter</text><text x="1010" y="284" fill="#b8c9d9" font-size="13">No implicit upload</text>
  </g>
  <g stroke="#6fe4d3" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M290 220H338"/><path d="M648 190H696"/><path d="M648 260H696"/><path d="M926 220H974"/></g>
  <rect x="55" y="357" width="1094" height="2" fill="#284967"/><text x="55" y="392" fill="#8ba5be" font-family="Segoe UI,Arial" font-size="13">Trust boundary: credential values and payload contents are never collected · enforcement remains deterministic · AI integration is optional and advisory</text>
</svg>
